core_principles:
- 'ローカル実態至上主義: ダッシュボードはPCローカル環境の真実を映す鏡であり、架空のテスト数値（インプレッション数・ダミー継続率等）は一切排除する。'
- 'Strict Project Isolation（完全固定・ゼロ混入）: プロジェクトを選択した際はそのプロジェクト専用のコンテキストに完全固定され、他プロジェクトのノイズを1文字も混入させない。'
- '路線図主義（教育工学規律）: 写実的な解剖図ではなく、起始(赤)・停止(青)・支配神経(黄)の3点のみを記号化した臨床・試験専用の配線図で直感理解を提供する。'
- '決定論と非決定論の分離（Dual-Key Harness）: コードによる決定論的検査（Playwright/OpenCV）とLLMによる意味論的検査（教育工学裁判官）を明確に区分して品質保証する。'
